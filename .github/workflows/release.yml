name: Maven Central Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example 0.1.2
        required: true
        default: 0.1.2
      publish:
        description: Deploy to Maven Central
        required: true
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 --decode > private.key
          test -s private.key
          head -n 1 private.key | grep -q 'BEGIN PGP PRIVATE KEY BLOCK'
          gpg --batch --import private.key
          gpg --list-secret-keys --keyid-format=long
          gpg --list-secret-keys --keyid-format=long | grep -q 'sec'
          rm -f private.key

      - name: Set release version
        run: mvn -B -ntp versions:set -DnewVersion="${{ inputs.release_version }}" -DgenerateBackupPoms=false

      - name: Verify release build
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Pcentral-release clean verify

      - name: Deploy to Maven Central
        if: ${{ inputs.publish }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Pcentral-release deploy -DskipTests
